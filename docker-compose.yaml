version: '3.8'

networks:
  veritas-net:
    driver: bridge

services:
  backend:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=6002
      - BACKEND_URL=${BACKEND_URL:-http://localhost:6002}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:6001}
      - JWT_SECRET=${JWT_SECRET:-veritas_jwt_super_secret_key_2026}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-veritas_jwt_refresh_super_secret_2026}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-veritas_master_encryption_vault_key}
      - DB_DIALECT=${DB_DIALECT:-sqlite}
    ports:
      - "${BACKEND_PORT:-6002}:6002"
    volumes:
      - ./backend/public/:/usr/src/app/public/
      - ./backend/whaticket.sqlite:/usr/src/app/whaticket.sqlite
      - ./backend/.wwebjs_auth/:/usr/src/app/.wwebjs_auth/
    restart: unless-stopped
    networks:
      - veritas-net

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    environment:
      - URL_BACKEND=backend:6002
      - REACT_APP_BACKEND_URL=${BACKEND_URL:-http://localhost:6002}/
    ports:
      - "${FRONTEND_PORT:-6001}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - veritas-net