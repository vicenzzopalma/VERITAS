name: Deploy Automático para VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy na VPS
    runs-on: ubuntu-latest

    steps:
      - name: Executar deploy via SSH na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Ajuste o caminho abaixo se seu projeto estiver em outra pasta na VPS
            cd /var/www/VERITAS || cd ~/VERITAS || cd /opt/VERITAS
            chmod +x deploy_vps.sh
            bash deploy_vps.sh
